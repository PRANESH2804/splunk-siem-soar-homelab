[Detection 1 - Failed Login Attempts]
search = index=security_lab (app=auth OR sourcetype="linux:auth:journal") ("Failed login" OR "failed password" OR "authentication failure") | table _time, host, app, severity, message
dispatch.earliest_time = -24h
dispatch.latest_time = now

[Detection 2 - Brute Force Multiple Failed Logins]
search = index=security_lab "Failed login attempt" | rex field=message "for\s+(?<target_user>\w+)\s+from\s+(?<src_ip>\d+\.\d+\.\d+\.\d+)" | stats count as fail_count, earliest(_time) as first_seen, latest(_time) as last_seen by src_ip, target_user | where fail_count >= 3 | eval duration_sec = last_seen - first_seen | fieldformat first_seen=strftime(first_seen, "%Y-%m-%d %H:%M:%S") | fieldformat last_seen=strftime(last_seen, "%Y-%m-%d %H:%M:%S")
dispatch.earliest_time = -24h
dispatch.latest_time = now
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
counttype = number of events
enableSched = 1
cron_schedule = */5 * * * *

[Detection 3 - Suspicious Command Execution]
search = index=security_lab (message="*powershell*" OR message="*-enc*" OR message="*base64*" OR message="*curl *sh*" OR message="*wget *sh*") | table _time, host, app, severity, message
dispatch.earliest_time = -24h
dispatch.latest_time = now

[Detection 4 - Suspicious Network Activity]
search = index=security_lab (app=network OR message="*outbound connection*" OR message="*:4444*" OR message="*:1337*") | rex field=message "to\s+(?<dest_ip>\d+\.\d+\.\d+\.\d+):(?<dest_port>\d+)" | table _time, host, app, severity, dest_ip, dest_port, message
dispatch.earliest_time = -24h
dispatch.latest_time = now

[Detection 5 - Malware Execution Attempt]
search = index=security_lab (app=antivirus OR severity=CRITICAL OR message="*malware*" OR message="*Trojan*") | rex field=message "detected:\s+(?<threat_signature>[^\s]+)\s+in\s+(?<file_path>[^\s]+)" | table _time, host, threat_signature, file_path, message
dispatch.earliest_time = -24h
dispatch.latest_time = now
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0
counttype = number of events
enableSched = 1
cron_schedule = */5 * * * *

[Detection 6 - Privileged Account Activity]
search = index=security_lab (app=audit OR message="*sudo*" OR message="*Privileged*" OR message="*session opened for user root*") | table _time, host, message
dispatch.earliest_time = -24h
dispatch.latest_time = now

[Correlation - Multi-Stage Potential Compromise]
search = index=security_lab | eval attack_stage = case(like(message, "%Failed login%"), "Stage 1: Failed Logins", like(message, "%powershell%") OR like(message, "%outbound connection%") OR like(message, "%Malware%"), "Stage 2: Suspicious Activity", 1=1, "Other") | where attack_stage != "Other" | stats dc(attack_stage) as distinct_stages, values(attack_stage) as stages_observed, values(message) as attack_evidence, earliest(_time) as start_time, latest(_time) as end_time by host | where distinct_stages >= 2 | eval incident_name = "Potential Host Compromise Detected: Multiple Attack Stages Observed on " . host | eval duration_minutes = round((end_time - start_time) / 60, 2) | fieldformat start_time=strftime(start_time, "%Y-%m-%d %H:%M:%S") | fieldformat end_time=strftime(end_time, "%Y-%m-%d %H:%M:%S") | table incident_name, host, stages_observed, duration_minutes, attack_evidence
dispatch.earliest_time = -24h
dispatch.latest_time = now
enableSched = 1
cron_schedule = */5 * * * *
